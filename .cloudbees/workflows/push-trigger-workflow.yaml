apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Push Trigger Workflow
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
jobs:
  build-on-push:
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1
      
      - name: Build on push
        uses: docker://alpine:latest
        shell: sh
        run: |
          echo "Building from push event"
          echo "Branch: ${{ cloudbees.scm.branch }}"
          echo "Commit: ${{ cloudbees.scm.sha }}"
          echo "Commit message: ${{ cloudbees.scm.commit.message }}"