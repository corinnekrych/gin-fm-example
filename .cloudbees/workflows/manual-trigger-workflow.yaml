apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Manual Trigger Workflow
on:
  workflow_dispatch:
jobs:
  manual-job:
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1
      
